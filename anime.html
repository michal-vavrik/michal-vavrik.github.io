<!DOCTYPE html>
<html>
	<head>
		<meta charset="utf-8">
		<meta name="viewport" content="width=device-width, initial-scale=1">
		<meta name="theme-color" content="#0b0d12">
		<link rel="preconnect" href="https://fonts.googleapis.com">
		<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
		<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap">
		<title>Anime</title>
		<link rel="stylesheet" type="text/css" href="css/main.css?v=redesign-2">
		<link rel="stylesheet" type="text/css" href="css/auth.css?v=redesign-1">
		<link rel="stylesheet" type="text/css" href="css/i18n.css?v=redesign-1">
		<link rel="stylesheet" type="text/css" href="css/anime.css?v=anime-serial-link-1">
		<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">
		<!-- Ochrana stránky musí proběhnout ještě před vykreslením obsahu. -->
		<script src="js/auth.js?v=anime-role-1"></script>
	</head>

	<body class="subpage">
		<header class="site-header">
			<div class="site-header__inner">
				<a class="site-header__brand" href="index.html" data-i18n-aria-label="nav.brand">
					<span class="site-header__logo" aria-hidden="true">MV</span>
					<span class="site-header__name">Michal Vavrík</span>
				</a>
				<button type="button" class="menu__toggler" aria-expanded="false" aria-controls="site-menu" aria-label="Menu" data-i18n-aria-label="nav.toggle"><span></span></button>
				<nav class="menu" id="site-menu" data-i18n-aria-label="nav.label">
					<a class="menu__link" href="index.html" data-i18n="nav.home">Home</a>
					<a class="menu__link" href="personal.html" data-i18n="nav.personal">Personal</a>
					<a class="menu__link" href="cv.html" data-i18n="nav.cv">CV</a>
					<a class="menu__link" href="games.html" data-i18n="nav.games">Games</a>
					<a class="menu__link" href="tools.html" data-i18n="nav.tools">Tools</a>
					<a class="menu__link" href="contact.html" data-i18n="nav.contact">Contact</a>
					<a class="menu__link active" aria-current="page" href="anime.html" data-i18n="nav.anime">Anime</a>
					<a class="menu__link" href="nv194.html">NV 194</a>
				</nav>
				<div class="header-controls">
					<div class="lang-switcher" id="lang-switcher">
						<button type="button" class="lang-switcher__toggle" id="lang-switcher-toggle" aria-haspopup="true" aria-expanded="false" aria-controls="lang-switcher-menu" data-i18n-aria-label="lang.switcher.label">
							<span class="lang-switcher__code" id="lang-switcher-code">CS</span>
							<span class="lang-switcher__caret" aria-hidden="true">▾</span>
						</button>
						<div class="lang-switcher__menu" id="lang-switcher-menu" role="menu" hidden>
							<button type="button" class="lang-switcher__option" role="menuitemradio" data-lang="cs" data-i18n="lang.name.cs">Čeština</button>
							<button type="button" class="lang-switcher__option" role="menuitemradio" data-lang="en" data-i18n="lang.name.en">English</button>
						</div>
					</div>

					<button type="button" class="auth-btn" id="auth-btn" aria-haspopup="dialog" aria-controls="auth-modal">
						<i class="fa fa-user auth-btn__icon" aria-hidden="true"></i>
						<span class="auth-btn__label">Přihlásit</span>
					</button>
				</div>
			</div>
		</header>

		<div class="auth-modal" id="auth-modal" hidden>
			<div class="auth-modal__backdrop" data-auth-close></div>

			<div class="auth-modal__dialog" role="dialog" aria-modal="true" aria-labelledby="auth-title">
				<button type="button" class="auth-modal__close" data-auth-close data-i18n-aria-label="auth.close">&times;</button>

				<div class="auth-modal__icon" aria-hidden="true"><i class="fa fa-lock"></i></div>
				<h2 class="auth-modal__title" id="auth-title" data-i18n="auth.title.login">Přihlášení</h2>
				<p class="auth-modal__lead" data-i18n="auth.lead.login">Chráněné stránky jsou dostupné po zadání hesla.</p>

				<p class="auth-modal__notice" id="auth-notice" hidden></p>

				<div class="auth-panel" id="auth-login-panel">
					<form id="auth-form" novalidate>
						<label class="auth-form__label" for="auth-password" data-i18n="auth.form.label">Heslo</label>
						<div class="auth-form__field">
							<input type="password" id="auth-password" name="password" placeholder="Zadejte heslo" data-i18n-placeholder="auth.form.placeholder" autocomplete="current-password">
							<button type="button" class="auth-form__reveal" id="auth-reveal" aria-pressed="false">Zobrazit</button>
						</div>
						<label class="auth-form__remember"><input type="checkbox" id="auth-remember"><span data-i18n="auth.form.remember">Trvale přihlásit</span></label>
						<p class="auth-form__error" id="auth-error" role="alert" hidden></p>
						<button type="submit" class="auth-modal__submit" data-i18n="auth.form.submit">Přihlásit se</button>
					</form>
				</div>

				<div class="auth-panel" id="auth-status-panel" hidden>
					<div class="auth-status__row">
						<span class="auth-status__label" data-i18n="auth.status.role">Oprávnění:</span>
						<span class="auth-status__value is-role" id="auth-status-role"></span>
					</div>
					<div class="auth-status__row">
						<span class="auth-status__label" data-i18n="auth.status.pages">Dostupné stránky:</span>
						<span class="auth-status__value" id="auth-status-pages"></span>
					</div>
					<button type="button" class="auth-modal__logout" id="auth-logout" data-i18n="auth.status.logout">Odhlásit se</button>
				</div>
			</div>
		</div>

		<script src="js/i18n.js?v=redesign-2"></script>
		<script src="js/lang-switcher.js"></script>
		<script src="js/auth-ui.js?v=anime-role-1"></script>
		<script src="js/menu.js?v=redesign-1"></script>

		<main class="anime">
			<h1 class="anime__title" data-i18n="anime.title">Anime list</h1>

			<!-- Lepivá lišta: hledání, action-bar (jen pro roli s přístupem všude) a hlavička sloupců. -->
			<div class="anime__toolbar" id="anime-toolbar">
				<div class="anime__toolbar-row">
					<div class="anime__search">
						<img class="anime__search-icon" src="img/anime/icons/Search.png" alt="" aria-hidden="true">
						<input type="text" id="anime-search" class="anime__search-input" data-i18n-placeholder="anime.search.placeholder" data-i18n-aria-label="anime.search.ariaLabel" placeholder="Hledej anime..." autocomplete="off">
					</div>

					<div class="anime__action-bar" id="anime-action-bar" hidden>
						<div class="anime__action-buttons">
							<button type="button" id="anime-update-toggle" class="anime__edit-btn anime__edit-btn--update" data-i18n="anime.update.button" aria-expanded="false" aria-controls="anime-update-menu" disabled>Aktualizovat</button>
							<button type="button" id="anime-push-btn" class="anime__edit-btn anime__edit-btn--push" data-i18n="anime.push.button" data-i18n-title="anime.push.title" disabled>Push</button>
							<button type="button" id="anime-edit-toggle" class="anime__edit-btn" data-i18n="anime.edit.start" aria-pressed="false">Upravit</button>
						</div>
						<p class="anime__edit-error" id="anime-edit-error" role="alert" hidden></p>

						<div class="anime__update-panel">
							<div class="anime__update-menu" id="anime-update-menu" role="group" data-i18n-aria-label="anime.update.menuLabel" hidden>
								<button type="button" id="anime-update-watched-btn" class="anime__edit-btn anime__edit-btn--update" data-update-action="watched" data-i18n="anime.update.watched">Zhlédnuté epizody</button>
								<button type="button" id="anime-update-csfd-btn" class="anime__edit-btn anime__edit-btn--update" data-update-action="csfd" data-i18n="anime.update.csfd">ČSFD hodnocení</button>
								<button type="button" id="anime-update-mal-btn" class="anime__edit-btn anime__edit-btn--update" data-update-action="mal" data-i18n="anime.update.mal">MAL hodnocení</button>
								<button type="button" id="anime-update-list-btn" class="anime__edit-btn anime__edit-btn--update" data-update-action="list" data-i18n="anime.update.list">Seznam</button>
								<button type="button" id="anime-update-all-btn" class="anime__edit-btn anime__edit-btn--update" data-update-action="all" data-i18n="anime.update.all">Všechno</button>
							</div>
							<p class="anime__update-info" id="anime-update-info" role="status"></p>
							<p class="anime__edit-error" id="anime-update-error" role="alert" hidden></p>
						</div>
					</div>
				</div>

				<div class="anime__header-wrap" id="anime-header-wrap" hidden>
					<div class="anime__header" id="anime-header" role="row"></div>
				</div>
			</div>

			<p class="anime__load-error" id="anime-load-error" data-i18n="anime.loadError" role="alert" hidden>Nepodařilo se načíst anime data. Zkuste stránku obnovit.</p>

			<div class="anime__list-wrap" id="anime-list-wrap" hidden>
				<div class="anime__list" id="anime-list" role="list"></div>
			</div>
		</main>

		<script src="js/anime-data.js?v=anime-action-bar-2"></script>
		<script src="js/anime-columns.js?v=redesign-1"></script>
		<script src="js/anime-row-view.js?v=anime-serial-link-1"></script>
		<script src="js/anime-view.js?v=redesign-1"></script>
		<script src="js/anime-proxy.js?v=anime-serial-link-1"></script>
		<script src="js/anime-sync.js?v=anime-serial-link-2"></script>
		<script src="js/anime-update.js?v=anime-serial-link-1"></script>
		<script src="js/anime-page.js?v=anime-action-bar-1"></script>

	</body>
</html>
