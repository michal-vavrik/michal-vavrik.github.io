<!DOCTYPE html>
<html>
	<head>
		<meta charset="utf-8">
		<meta name="viewport" content="width=device-width, initial-scale=1">
		<title>Contact</title>
		<link rel="stylesheet" type="text/css" href="css/main.css">
		<link rel="stylesheet" type="text/css" href="css/auth.css">
		<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">
		<!-- Ochrana stránky musí proběhnout ještě před vykreslením obsahu. -->
		<script src="js/auth.js"></script>
	</head>
	
	<body class="subpage">
				<!-- Menu elements-->
		<nav class="menu">
			<a class="menu__link" href="index.html">Home</a>
			<a class="menu__link" href="personal.html">Personal</a>
			<a class="menu__link" href="cv.html">CV</a>
			<a class="menu__link" href="games.html">Games</a>
			<a class="menu__link active" href="contact.html">Contact</a>
			<a class="menu__link" href="nv194.html">NV194</a>
		</nav>
		<div class="menu__toggler"><span></span></div>
		
		<button type="button" class="auth-btn" id="auth-btn" aria-haspopup="dialog" aria-controls="auth-modal">
			<i class="fa fa-user auth-btn__icon" aria-hidden="true"></i>
			<span class="auth-btn__label">Přihlásit</span>
		</button>

		<div class="auth-modal" id="auth-modal" hidden>
			<div class="auth-modal__backdrop" data-auth-close></div>

			<div class="auth-modal__dialog" role="dialog" aria-modal="true" aria-labelledby="auth-title">
				<button type="button" class="auth-modal__close" data-auth-close aria-label="Zavřít">&times;</button>

				<div class="auth-modal__icon" aria-hidden="true"><i class="fa fa-lock"></i></div>
				<h2 class="auth-modal__title" id="auth-title">Přihlášení</h2>
				<p class="auth-modal__lead">Chráněné stránky jsou dostupné po zadání hesla.</p>

				<p class="auth-modal__notice" id="auth-notice" hidden></p>

				<div class="auth-panel" id="auth-login-panel">
					<form id="auth-form" novalidate>
						<label class="auth-form__label" for="auth-password">Heslo</label>
						<div class="auth-form__field">
							<input type="password" id="auth-password" name="password" placeholder="Zadejte heslo" autocomplete="current-password">
							<button type="button" class="auth-form__reveal" id="auth-reveal" aria-pressed="false">Zobrazit</button>
						</div>
						<p class="auth-form__error" id="auth-error" role="alert" hidden></p>
						<button type="submit" class="auth-modal__submit">Přihlásit se</button>
					</form>
				</div>

				<div class="auth-panel" id="auth-status-panel" hidden>
					<div class="auth-status__row">
						<span class="auth-status__label">Oprávnění:</span>
						<span class="auth-status__value is-role" id="auth-status-role"></span>
					</div>
					<div class="auth-status__row">
						<span class="auth-status__label">Dostupné stránky:</span>
						<span class="auth-status__value" id="auth-status-pages"></span>
					</div>
					<button type="button" class="auth-modal__logout" id="auth-logout">Odhlásit se</button>
				</div>
			</div>
		</div>

		<script src="js/auth-ui.js"></script>
		<script src="js/menu.js"></script>

	</body>
</html>
